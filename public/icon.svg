<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="petrolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="dieselGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="8"/>
  
  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#334155" stroke-dasharray="12 8" stroke-width="3"/>
  
  <!-- Fuel Pump Body -->
  <rect x="140" y="160" width="160" height="230" rx="20" fill="#1e293b" stroke="#64748b" stroke-width="8" />
  
  <!-- Pump Display Screen -->
  <rect x="160" y="190" width="120" height="70" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="4" />
  <!-- Screen Numbers / Glow -->
  <text x="220" y="235" fill="#38bdf8" font-size="28" font-family="monospace" font-weight="bold" text-anchor="middle">HADI</text>
  
  <!-- Dual Fuel Indicators -->
  <circle cx="180" cy="295" r="14" fill="url(#petrolGrad)" />
  <circle cx="260" cy="295" r="14" fill="url(#dieselGrad)" />
  <text x="180" y="325" fill="#10b981" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">PETROL</text>
  <text x="260" y="325" fill="#f59e0b" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">DIESEL</text>
  
  <!-- Pump Base -->
  <rect x="120" y="380" width="200" height="25" rx="6" fill="#475569" />
  
  <!-- Hose & Nozzle -->
  <path d="M 300 240 Q 370 240 370 310 L 370 330 Q 370 360 340 360" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
  <!-- Nozzle Gun -->
  <path d="M 340 360 L 325 340 L 350 315 L 375 320 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/>
  
  <!-- Top Fuel Drop Badge -->
  <path d="M 256 80 C 256 80 200 140 200 170 C 200 200 225 225 256 225 C 287 225 312 200 312 170 C 312 140 256 80 256 80 Z" fill="url(#petrolGrad)" opacity="0.85"/>
  <path d="M 245 130 Q 235 150 235 170" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
</svg>
