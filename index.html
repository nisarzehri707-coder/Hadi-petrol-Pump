<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hadi Petrol" />
    <meta name="description" content="Hadi Petrol Pump Management System - Mobile PWA for Tanveer Zehri" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Google Fonts: Inter, Noto Sans Arabic for Urdu, and JetBrains Mono for Numbers -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+Arabic:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    
    <title>HADI PETROL PUMP - Tanveer Zehri</title>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased select-none font-sans min-h-screen">
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
          root.innerHTML = '<div style="color:#f87171;padding:24px;font-family:sans-serif;background:#0f172a;margin:20px;border-radius:12px;border:1px solid #ef4444;"><h3>Startup Error:</h3><pre style="white-space:pre-wrap;">' + (e.message || (e.error && e.error.message) || e) + '</pre><p style="color:#94a3b8;font-size:12px;">' + (e.filename || '') + ':' + (e.lineno || '') + '</p><button onclick="localStorage.clear();window.location.reload();" style="padding:8px 14px;background:#334155;color:white;border:none;border-radius:6px;cursor:pointer;margin-top:10px;">Reset Storage & Reload</button></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
